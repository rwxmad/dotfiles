include=/usr/share/foot/themes/gruvbox-dark

font=JetBrainsMono Nerd Font:size=10
pad=0x2 center
workers=0
selection-target=both

[scrollback]
lines=10000

[cursor]
style=block
blink=yes

[colors-dark]
